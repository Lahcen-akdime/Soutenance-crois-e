<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="sctipt.js" defer></script>
    <title>Workspace</title>
</head>

<body>
    <aside>
        <h1 style="color: rgb(42, 42, 42) ; margin-bottom: 1rem;">Staff members (Unassigned)</h1>
        <div class="workerszone"></div>
        <button id="addnewmember-btn" onclick=displayform()>Add a new member +</button>
    </aside>
    <!-- _____________________________________  Les Zones d'ajoute   _____________________________________ -->
    <main>
        <div id="left">
            <div id="box1">
                <h2>Conference room</h2>
                <div class="zonecrd conference">
                    
                </div>
                <button class="addinconference" id="conference" value="conference"
                    onclick="showselectmodal(id,value)">+</button>
            </div>
            <div id="box2">
                <h2>Reception</h2>
                <div class="zonecrd reception">


                </div>
                <button id="Réceptionniste" class="addinreception" value="reception"
                    onclick="showselectmodal(id,value)">+</button>
            </div>
        </div>
        <div id="midle"></div>
        <div id="right">
            <div id="box3">
                <div id="chombr1">
                    <h2>Servers room</h2>
                <div class="zonecrd servers">

                </div>
                    <button class="addinservers" value="servers" id="Technicien IT"
                        onclick="showselectmodal(id,value)">+</button>
                </div>
                <div id="chombr2">
                    <h2>Securité room</h2>
                <div class="zonecrd sécurité">
                    
                </div>
                    <button class="addinsecurité" value="sécurité" id="Agent de sécurité"
                        onclick="showselectmodal(id,value)">+</button>
                </div>
            </div>
            <div id="box4">
                <div id="chombr3">
                    <h2>staff room</h2>
                <div class="zonecrd staff" id="staff">

                </div>
                    <button class="addstaffroom" id="staffroom" value="staff"
                        onclick="showselectmodal(id,value)">+</button>
                </div>
                <div id="chombr4">
                    <h2>Vault</h2>
                <div class="zonecrd vault">

                </div>
                    <button class="addvalaut" value="vault" onclick="showselectmodal(id,value)">+</button>
                </div>
            </div>
        </div>
    </main>
    <!-- _____________________________________  formulaire _____________________________________ -->
    <div id="blurbackround">
        <div id="formmodal">
            <form action="" id="form-create-worker">
                <label for="">Nom :</label>
                <input id="name" type="text">
                <label for="">Role :</label>
                <select name="roles" id="">
                    <option value="Réceptionniste">Réceptionniste</option>
                    <option value="Technicien IT">Technicien IT</option>
                    <option value="Agent de sécurité">Agent de sécurité</option>
                    <option value="Manager">Manager</option>
                    <option value="Netoyage">Netoyage</option>
                    <option value="Autre">Autre</option>
                </select>
                <label for="">Photo (url) :</label>
                <input id="photolink" type="url">
                <div id="imageplace"></div>
                <label for="">Experiences :</label>
                <div id="allexperiences">
                    <div class="Experiencecarte" id="0">
                        <label for="">Company :</label>
                        <input type="text" id="companyname">
                        <label for="">Role :</label>
                        <input type="text" id="role-in-company">
                        <label for="">From :</label>
                        <input type="date" id="debut">
                        <label for="">To :</label>
                        <input type="date" id="fin">
                    </div>
                </div>
                <button id="Addexperience-btn" type="button"><b>Add Experience</b> </button>
                <label for="">Email :</label>
                <input id="email" type="email">
                <label for="">Phone number :</label>
                <input id="phonenumber" type="number">
                <input type="submit" id="Update-worker-btn"></input>
                <button id="close-btn" type="button" onclick="returntomain()"><b>Close</b></button>
            </form>
        </div>
    </div>
    <!-- _____________________________________  worker description _____________________________________ -->
    <div id="blurbackround" class="forblurmodal2">
        <div id="formmodal" class="modal2">
            <div id="profil">
                <div id="image2place"></div>
                <div>
                    <div>
                        <h2 id="worker-name">worker name</h2>
                    </div>
                    <div>
                        <p id="worker-role">worker-role</p>
                    </div>
                </div>
            </div>
            <div class="experiencediv">
                <ul>
                    <li><b>Email :</b><span id="worker-email"></span></li>
                    <li><b>Phone :</b><span id="worker-phone"></span></li>
                    <li><b>Current Location : </b><span id="location">Unassigned</span></li>
                </ul>
            </div>
            <div style="display:flex;flex-direction: column;gap: 1rem;">
                <h3>Work Experience : </h3>
                <div class="cartedescription" id="experiences-place">
                </div>
            </div>
            <div style="height: 10vh;">
                <button id="closedescreption-btn" type="button" onclick="returntomain()"><b
                        style="font-size: 1rem;">Close</b></button>
            </div>
        </div>
    </div>
    <!-- _____________________________________ select a worker _____________________________________ -->
    <div id="blurbackround" class="forblurmodal3">
        <div id="formmodal3" class="modal3">
            <div class="toflex">
                <h2 style="color: rgb(42, 42, 42) ;"> Select Worker to Assign : </h2>
                <div id="workersplace"></div>
            </div>
            <button id="close-btn" type="button" onclick="returntomain()">
                <b>Close</b>
            </button>
        </div>
    </div>
</body>
</html>
