<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="sctipt.js" defer></script>
    <title>Workspace</title>
</head>

<body>
    <aside>
        <div class="workerszone">
            <h1 style="color: rgb(42, 42, 42) ; margin-bottom: 1rem;">Staff members (Unassigned)</h1>
        </div>
        <button id="addnewmember-btn" onclick=displayform()>Add a new member +</button>
    </aside>
    <main>
        <div id="left">
            <div id="box1">
                <h2>Conference room</h2>
                <button id="addinconference">+</button>
            </div>
            <div id="box2">
                <h2>Reception</h2>
                <button id="addinreception">+</button>
            </div>
        </div>
        <div id="midle"></div>
        <div id="right">
            <div id="box3">
                <div id="chombr1">
                    <h2>Servers room</h2>
                    <button id="addinservers">+</button>
                </div>
                <div id="chombr2">
                    <h2>Securité room</h2>
                    <button id="addinsecurité">+</button>
                </div>
            </div>
            <div id="box4">
                <div id="chombr3">
                    <h2>staff room</h2>
                    <button id="addstaff">+</button>
                </div>
                <div id="chombr4">
                    <h2>Vault</h2>
                    <button id="addvalaut">+</button>
                </div>
            </div>
        </div>
    </main>
    <!-- ==============================  formulaire ================================= -->
    <div id="blurbackround">
        <div id="formmodal">
            <form action="">
                <label for="">Nom :</label>
                <input id="name" type="text">
                <label for="">Role :</label>
                <select name="roles" id="">
                    <option value="Réceptionniste">Réceptionniste</option>
                    <option value="Technicien IT">Technicien IT</option>
                    <option value="Agent de sécurité">Agent de sécurité</option>
                    <option value="Manager">Manager</option>
                    <option value="Netoyage">Netoyage</option>
                    <option value="Autre">Autre</option>
                </select>
                <label for="">Photo (url) :</label>
                <input id="photolink" type="url">
                <div id="imageplace"></div>
                <label for="">Experiences :</label>
                <div id="allexperiences">
                    <div class="Experiencecarte" id="0">
                        <label for="">Company :</label>
                        <input type="text" id="companyname">
                        <label for="">Role :</label>
                        <input type="text" id="role-in-company">
                        <label for="">From :</label>
                        <input type="date" id="debut">
                        <label for="">To :</label>
                        <input type="date" id="fin">
                    </div>
                </div>
                <button id="Addexperience-btn" type="button"><b>Add Experience</b> </button>
                <label for="">Email :</label>
                <input id="email" type="email">
                <label for="">Phone number :</label>
                <input id="phonenumber" type="number">
                <input type="submit" id="Update-worker-btn"></input>
                <button id="close-btn" type="button" onclick="returntomain()"><b>Close</b></button>
            </form>
        </div>
    </div>
    <!-- ==============================  worker description ================================= -->
    <div id="blurbackround" class="forblurmodal2">
        <div id="formmodal" class="modal2">
            <div id="profil">
                <div id="image2place"></div>
                <div>
                    <div>
                        <h2 id="worker-name">worker name</h2>
                    </div>
                    <div>
                        <p id="worker-role">worker-role</p>
                    </div>
                </div>
            </div>
            <div class="experiencediv">
                <ul>
                    <li><b>Email :</b><span id="worker-email"></span></li>
                    <li><b>Phone :</b><span id="worker-phone"></span></li>
                    <li><b>Current Location : </b><span>Unassigned</span></li>
                </ul>
            </div>
            <div style="display:flex;flex-direction: column;gap: 1rem;">
                <h3>Work Experience : </h3>
                <div class="cartedescription" id="experiences-place">
                    <!-- <div><h4 style="display: inline;">Place : </h4><p style="display: inline;">youcode</p></div>
                <ul>
                    <li><b>Role : </b><span>IT</span></li>
                    <li><b>Period : </b><span>11/12/2025</span>- <span>11/07/2027</span></li>
                </ul> -->
                </div>
            </div>
            <div style="height: 10vh;">
                <button id="closedescreption-btn" type="button" onclick="returntomain()"><b
                        style="font-size: 1rem;">Close</b></button>
            </div>
        </div>
    </div>
    <!-- ================================= select a worker ================================== -->
     <div id="blurbackround" class="forblurmodal3">
        <div id="formmodal3" class="modal3">
        </div>
        </div>
</body>

</html>
