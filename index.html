<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="sctipt.js" defer></script>
    <title>Workspace</title>
</head>
<body>
    <aside>
   <h1 style="color: rgb(42, 42, 42);">Staff members (Unassigned)</h1>
   <button id="addnewmember-btn">Add a new member +</button>
    </aside>
<main>
<div id="left">
    <div id="box1">
        <h2>Conference room</h2>
        <button id="addinconference">+</button>
    </div>
    <div id="box2">
        <h2>Reception</h2>
        <button id="addinreception">+</button>
    </div>
</div>
<div id="midle"></div>
<div id="right">
    <div id="box3">
        <div id="chombr1">
            <h2>Servers room</h2>
            <button id="addinservers">+</button>
        </div>
        <div id="chombr2">
            <h2>Securité room</h2>
            <button id="addinsecurité">+</button>
        </div>
    </div>
    <div id="box4">
        <div id="chombr3">
            <h2>staff room</h2>
            <button id="addstaff">+</button>
        </div>
        <div id="chombr4">
            <h2>Vault</h2>
            <button id="addvalaut">+</button>
        </div>
    </div>
</div>
</main>
<div id="blurbackround">
<div id="formmodal">
<form action="">
    <label for="">Nom :</label>
    <input type="text">
    <label for="">Role :</label>
    <select name="roles" id="">
        <option value="1">Réceptionniste</option>
        <option value="2">Technicien IT</option>
        <option value="3">Agent de sécurité</option>
        <option value="3">Manager</option>
        <option value="3">Netoyage</option>
        <option value="4">Autre</option>
    </select>
    <label for="">Photo (url) :</label>
    <input type="text">
    <div id="imageplace"></div>
    <label for="">Experiences :</label>
    <div class="formcarte">
         <label for="">Company :</label>
    <input type="text">
    <label for="">Role :</label>
    <input type="text"> 
    <label for="">From :</label>
    <input type="date"> 
    <label for="">To :</label>
    <input type="date">
    </div>
    <button id="Addexperience-btn"><b>Add Experience</b>  </button>
    <label for="">Email :</label>
    <input type="email">
    <label for="">Phone number :</label>
    <input type="number">
    <button id="Update-worker-btn"><b>Updade worker</b></button>
    <button id="close-btn"><b>Close</b></button>
</form>
</div>
</div>
</body>
</html>
